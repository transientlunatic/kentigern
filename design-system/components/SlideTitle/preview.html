<!-- @dsCard group="Slides" height=540 width=960 subtitle="Title layout" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Lato:ital,wght@0,300;0,400;0,700;1,900&family=Source+Code+Pro:wght@400&display=swap">
<style>
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
.s{width:960px;height:540px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--surface);color:var(--ink);padding:48px}
/* 1920px slide drawn at 0.5 scale */
.h1{font:italic 400 32px/36px var(--font-serif);margin:0}
.body{font:300 20px/28px var(--font-sans)}
.ref{font:400 13px/17px var(--font-mono);color:var(--ink-muted);position:absolute;right:48px;bottom:32px}
.num{font:400 13px/17px var(--font-mono);color:var(--ink-muted);position:absolute;right:48px;bottom:32px}

.t{font:italic 400 44px/48px var(--font-serif);margin:0 0 16px}
.sub{font:300 24px/32px var(--font-sans);color:var(--ink-muted);margin:0;max-width:440px}
.who{position:absolute;left:48px;bottom:48px;font:300 18px/26px var(--font-sans)}
.who b{font-weight:700}.who i{color:var(--ink-muted);font-style:normal}
svg{position:absolute;right:0;bottom:0}
.arc{fill:none;stroke-width:2}

</style></head><body><div class="s" data-theme="dark">
<div style="position:absolute;left:48px;top:140px;width:520px"><h1 class="t">GWTC-5.0 &amp; Beyond</h1><p class="sub">Updated transients observations and results from O4</p></div>
<div class="who"><b>Daniel Williams</b><br><i>Institute for Gravitational Research, University of Glasgow</i><br><i>For the LIGO-Virgo-KAGRA Collaboration</i><br><i style="font:400 13px/20px var(--font-mono)">daniel-williams.co.uk</i></div>
<svg width="420" height="420" viewBox="0 0 420 420" aria-hidden="true">
<circle class="arc" cx="420" cy="420" r="96" stroke="var(--primary)"/><circle class="arc" cx="420" cy="420" r="160" stroke="var(--indigo)"/><circle class="arc" cx="420" cy="420" r="224" stroke="var(--gold)"/><circle class="arc" cx="420" cy="420" r="288" stroke="var(--green)"/><circle class="arc" cx="420" cy="420" r="352" stroke="var(--rule)"/></svg>
</div></body></html>
