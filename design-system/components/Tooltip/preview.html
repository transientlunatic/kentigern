<!-- @dsCard group="Charts" height=200 subtitle="Chart tooltip and legend pill" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Lato:ital,wght@0,300;0,400;0,700;1,900&family=Source+Code+Pro:wght@400&display=swap">
<style>
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}

.wrap{padding:24px;display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap}
.tip{background:var(--surface-raised);color:var(--ink);border:1px solid var(--border-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-tooltip);padding:7px 10px;font:400 13px/1.4 var(--font-sans);white-space:nowrap}
.tip b{font-weight:700}.tip .m{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted)}
.pill{font:400 13px/1 var(--font-sans);color:var(--ink);background:none;border:1px solid var(--rule);border-radius:var(--radius-pill);padding:4px 12px;display:inline-flex;gap:6px;align-items:center;margin-right:6px}
.pill svg{display:block}.pill:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pill[aria-pressed=true]{border-color:var(--border-strong)}

</style></head><body><div class="wrap"><div class="tip"><b style="color:var(--run-o4a)">O4a</b> · <span class="m">GW230814</span><br>SNR 42, Livingston-only</div>
<div><button class="pill" aria-pressed="true"><svg width="10" height="10"><circle cx="5" cy="5" r="5" fill="var(--run-o4a)"/></svg>O4a</button><button class="pill" aria-pressed="true"><svg width="10" height="10"><circle cx="5" cy="5" r="5" fill="var(--run-o4b)"/></svg>O4b</button><button class="pill" aria-pressed="false"><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="none" stroke="var(--run-o4c)" stroke-width="2"/></svg>O4c, partial</button></div></div></body></html>
