<!-- @dsCard group="Slides" height=540 width=960 subtitle="Three-step process with chevrons" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Lato:ital,wght@0,300;0,400;0,700;1,900&family=Source+Code+Pro:wght@400&display=swap">
<style>
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
.s{width:960px;height:540px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--surface);color:var(--ink);padding:48px}
/* 1920px slide drawn at 0.5 scale */
.h1{font:italic 400 32px/36px var(--font-serif);margin:0}
.body{font:300 20px/28px var(--font-sans)}
.ref{font:400 13px/17px var(--font-mono);color:var(--ink-muted);position:absolute;right:48px;bottom:32px}
.num{font:400 13px/17px var(--font-mono);color:var(--ink-muted);position:absolute;right:48px;bottom:32px}

.row{display:flex;margin-top:96px;gap:0}
.st{flex:1;height:176px;padding:24px 56px 24px 56px;box-sizing:border-box;background:var(--primary);color:var(--on-primary);clip-path:polygon(0 0,calc(100% - 40px) 0,100% 50%,calc(100% - 40px) 100%,0 100%,40px 50%);margin-left:-8px;display:flex;flex-direction:column;justify-content:center}
.st:first-child{clip-path:polygon(0 0,calc(100% - 40px) 0,100% 50%,calc(100% - 40px) 100%,0 100%);margin-left:0;padding-left:32px}
.st.cur{background:var(--gold);color:var(--on-gold)}
.st b{font:700 20px/26px var(--font-sans);display:block}
.st span{font:400 16px/22px var(--font-sans)}

</style></head><body><div class="s" data-theme="dark"><h1 class="h1">The process</h1><div class="row">
<div class="st"><b>GW signal</b><span>Produces measurable signal in IFO</span></div>
<div class="st"><b>Online search</b><span>Scour h-of-t data for evidence of an astrophysical signal</span></div>
<div class="st cur"><b>Online PE</b><span>Automated fast PE is run on significant triggers</span></div></div></div></body></html>
