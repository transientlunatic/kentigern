<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Lato:ital,wght@0,300;0,400;0,700;1,900&family=Source+Code+Pro:wght@400&display=swap">
<style>
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
.s{width:960px;height:540px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--surface);color:var(--ink);padding:48px}
/* 1920px slide drawn at 0.5 scale */
.h1{font:italic 400 32px/36px var(--font-serif);margin:0}
.body{font:300 20px/28px var(--font-sans)}
.ref{font:400 13px/17px var(--font-mono);color:var(--ink-muted);position:absolute;right:48px;bottom:32px}
.num{font:400 13px/17px var(--font-mono);color:var(--ink-muted);position:absolute;right:48px;bottom:32px}

table{border-collapse:collapse;margin-top:24px;width:100%;font:400 18px/26px var(--font-sans)}
th{font:300 18px/26px var(--font-sans);color:var(--ink-muted);text-align:left;padding:4px 16px}
td{padding:4px 16px}th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.cur td{background:var(--gold);color:var(--on-gold);font-weight:700}
tr.cur td:first-child{border-radius:4px 0 0 4px}tr.cur td:last-child{border-radius:0 4px 4px 0}
